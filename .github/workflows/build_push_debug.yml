name: Debug Builder
on:
  push:
   branches:
    - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build app
        run: ./gradlew assembleFoss

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/foss
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss-unsigned-signed.apk TachiyomiSY.apk
          mv app/build/outputs/apk/foss/app-arm64-v8a-foss-unsigned-signed.apk TachiyomiSY-arm64-v8a.apk
          mv app/build/outputs/apk/foss/app-armeabi-v7a-foss-unsigned-signed.apk TachiyomiSY-armeabi-v7a.apk
          mv app/build/outputs/apk/foss/app-x86-release-foss-signed.apk TachiyomiSY-x86.apk
          mv app/build/outputs/apk/foss/app-x86_64-release-foss-signed.apk TachiyomiSY-x86_64.apk

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_number }}
          name: TachiyomiSY
          body: |
            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `TachiyomiSY.apk`
          files: |
            TachiyomiSY.apk
            TachiyomiSY-arm64-v8a.apk
            TachiyomiSY-armeabi-v7a.apk
            TachiyomiSY-x86.apk
            TachiyomiSY-x86_64.apk
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
